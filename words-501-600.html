const RANGES=[[501,520],[521,540],[541,560],[561,580],[581,600]];
const a=document.getElementById('a'),tb=document.querySelector('#t tbody');
let mode='en',cur=DATA[0].n,loop=false,auto=false,range='all',view=DATA.slice();
function inRange(d){return range==='all'||(d.n>=+range.split('-')[0]&&d.n<=+range.split('-')[1]);}
function render(){
  tb.innerHTML='';
  view.forEach(d=>{const tr=document.createElement('tr');tr.dataset.n=d.n;
    tr.innerHTML='<td class="n">'+d.n+'</td><td class="w">'+d.w+'</td><td class="ph">'+d.ph+'</td><td class="pos">'+d.pos+'</td><td class="m">'+d.m+'</td><td class="play">▶</td>';
    tr.onclick=()=>play(d.n);tb.appendChild(tr);});
  mark();
}
function mark(){[].slice.call(tb.children).forEach(tr=>tr.classList.toggle('cur',+tr.dataset.n===cur));}
function play(n){cur=n;mark();const d=DATA.filter(x=>x.n===n)[0];if(!d)return;
  a.src=d.f+'_'+mode+'.mp3?t='+Date.now();a.play();}
a.onended=()=>{if(loop){play(cur);return;}if(auto)next(1);};
function next(k){const i=view.findIndex(d=>d.n===cur);let j=i+k;if(i<0)j=0;if(j<0)j=view.length-1;if(j>=view.length)j=0;
  if(!view.length)return;play(view[j].n);}
a.onerror=()=>{document.querySelector('.hint').textContent='音频没加载出来——如果是在预览里，改用浏览器打开这个试试。';};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.m;
  document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));play(cur);});
document.getElementById('loop').onclick=e=>{loop=!loop;e.target.textContent='单曲循环：'+(loop?'开':'关');e.target.classList.toggle('on',loop);};
document.getElementById('auto').onclick=e=>{auto=!auto;e.target.textContent='自动连播：'+(auto?'开':'关');e.target.classList.toggle('on',auto);};

function filter(){const s=document.getElementById('q').value.trim().toLowerCase();
  view=DATA.filter(d=>inRange(d)&&(!s||d.w.toLowerCase().indexOf(s)>=0||d.m.indexOf(s)>=0||String(d.n)===s));
  render();}
