function norm(s){return (s||'').replace(/[\s\u3000]/g,'').replace(/[，,、;；.。:：!！?？"'“”‘’（）()\[\]【】·\/\\-]/g,'').toLowerCase();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d.push([i]);for(let j=1;j<=n;j++)d[i].push(0);}for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}

function judgeCN(v,d){const n=norm(v);if(!n)return 'empty';const ks=keysCN(d),full=norm(d.m.replace(/[（(].*?[)）]/g,''));

  if(full.indexOf(n)>=0&&n.length>=1)return 'ok';
  if(ks.some(k=>k.indexOf(n)>=0&&n.length>=2))return 'ok';
  if(n.length<2)return 'no';
  let best=99;ks.forEach(k=>{const x=lev(n,k);if(x<best)best=x;});return best<=1?'near':'no';}

    pick=base.filter(d=>d.n>=s).slice(0,k);

function say(w){const a=$('#a');a.src='单词音频/'+String(w.n).padStart(3,'0')+'_'+w.w+'_en.mp3?t='+Date.now();a.play();}
function grade(){let ok=0,tot=0,wrong=[];
