    for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    u=BC[word]=URL.createObjectURL(new Blob([a],{type:'audio/mpeg'}));}
  const au=new Audio(u);au.playbackRate=0.9;const p=au.play();if(p&&p.catch)p.catch(function(){});}
function norm(s){return (s||'').replace(/[\s\u3000]/g,'').replace(/[，,、;；.。:：!！?？"'“”‘’（）()\[\]【】·\/\\-]/g,'').toLowerCase();}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d.push([i]);for(let j=1;j<=n;j++)d[i].push(0);}for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
function keysCN(d){const ks=d.m.split(/[；;，,、\/]/).map(norm).filter(x=>x.length>=2);return ks.concat((EXTRA[d.w]||[]).map(norm));}
function judgeCN(v,d){const n=norm(v);if(!n)return 'empty';const ks=keysCN(d),full=norm(d.m.replace(/[（(].*?[)）]/g,''));
  if(ks.some(k=>n.indexOf(k)>=0))return 'ok';
  if(full.indexOf(n)>=0&&n.length>=1)return 'ok';
  if(ks.some(k=>k.indexOf(n)>=0&&n.length>=2))return 'ok';
  if(n.length<2)return 'no';
  let best=99;ks.forEach(k=>{const x=lev(n,k);if(x<best)best=x;});return best<=1?'near':'no';}
function judgeEN(v,d){const n=norm(v);if(!n)return 'empty';if(n===d.w)return 'ok';const k=lev(n,d.w);return (k<=1&&d.w.length>=4)?'near':'no';}
function render(q,el,dir){el.innerHTML='';q.forEach((o,i)=>{const div=document.createElement('div');div.className='q';
  div.innerHTML='<div class="ask">'+(i+1)+'. '+(dir===1?('<b>'+o.d.w+'</b> <small>'+o.d.ph+'</small>'):('<b>'+o.d.m+'</b>'))+
  '</div><input placeholder="'+(dir===1?'中文意思':'英文单词')+'" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="res"></div><div class="ex"></div>';
  el.appendChild(div);o.el=div;});}
function pool(){const v=$('#rg').value;if(v==='all')return DATA.slice();const p=v.split('-');return DATA.filter(d=>d.n>=+p[0]&&d.n<=+p[1]);}
function draw(){const base=pool();if(!base.length){$('#meta').textContent='这个范围没词';return;}
  const v=$('#cnt').value;let pick,mode='';
  if(v==='all'){pick=base.slice();mode='范围内全部';}
  else if(v[0]==='f'){const k=+v.slice(1),stEl=$('#st');let s=parseInt(stEl.value,10);
    if(!s)s=base[0].n;if(s<base[0].n)s=base[0].n;if(s>base[base.length-1].n)s=base[base.length-1].n;stEl.value=s;
    pick=base.filter(d=>d.n>=s).slice(0,k);
    mode='固定 '+pick.length+' 词（'+pick[0].n+'-'+pick[pick.length-1].n+'，出题仍乱序）';}
  else{const k=+v.slice(1);pick=shuffle(base).slice(0,k);mode='随机 '+k+' 词';}
  const cnt=pick.length;if(!cnt){$('#meta').textContent='这个范围没词';return;}
  $('#stw').style.display=(v[0]==='f')?'inline':'none';
  const sh=shuffle(pick);
  Q1=sh.map(d=>({d:d,dir:1}));Q2=shuffle(pick).map(d=>({d:d,dir:2}));graded=false;$('#board').style.display='none';
  render(Q1,$('#s1'),1);render(Q2,$('#s2'),2);
  $('#meta').textContent='词池 '+base.length+' 词｜'+mode+'｜英译中 '+cnt+' 题 + 中译英 '+cnt+' 题 = '+(cnt*2)+' 题';}
function grade(){let ok=0,tot=0,wrong=[];
  [[Q1,1],[Q2,2]].forEach(pair=>pair[0].forEach(o=>{const dir=pair[1];tot++;const inp=o.el.querySelector('input');
    const r=dir===1?judgeCN(inp.value,o.d):judgeEN(inp.value,o.d);const box=o.el.querySelector('.res'),ex=o.el.querySelector('.ex');
    box.className='res '+(r==='ok'?'ok':r==='near'?'near':'no');
    box.textContent=r==='ok'?'✓ 对':r==='near'?'≈ 差一点':(r==='empty'?'✗ 空':'✗ 错');o.result=r;
    ex.innerHTML='正确答案：'+(dir===1?(o.d.m+'　|　'+o.d.w+' '+o.d.ph):(o.d.w+' '+o.d.ph+'　|　'+o.d.m))+' <span class="spk">🔊</span>';
    ex.querySelector('.spk').onclick=()=>speak(o.d.w,'en');
    if(r==='ok')ok++;else wrong.push({n:o.d.n,w:o.d.word});}));
  graded=true;const b=$('#board');b.style.display='block';
  const uniq=[...new Set(wrong.map(x=>x.n))];
  b.textContent='得分：'+ok+' / '+tot+'（'+Math.round(ok/tot*100)+'%）\n'+(wrong.length?('错题 '+wrong.length+' 题，共 '+uniq.length+' 个词：'+uniq.map(n=>{const d=DATA.filter(x=>x.n===n)[0];return '\n· '+d.n+' '+d.w+' — '+d.m;}).join('')):'全对。');}
$('#go').onclick=draw;$('#submit').onclick=grade;
$('#again').onclick=function(){if(!graded){alert('先提交批改');return;}
  Q1=Q1.filter(o=>o.result!=='ok').map(o=>({d:o.d,dir:1}));Q2=Q2.filter(o=>o.result!=='ok').map(o=>({d:o.d,dir:2}));
  if(!Q1.length&&!Q2.length){$('#board').textContent='没有错题。';return;}
  render(Q1,$('#s1'),1);render(Q2,$('#s2'),2);graded=false;$('#board').style.display='none';
  $('#meta').textContent='错题重做：英译中 '+Q1.length+' + 中译英 '+Q2.length;};
$('#rg').onchange=function(){const b=pool();if(b.length)$('#st').value=b[0].n;draw();};$('#cnt').onchange=draw;$('#st').onchange=draw;
draw();
