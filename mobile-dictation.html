function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++){d.push([i]);for(let j=1;j<=n;j++)d[i].push(0);}for(let j=0;j<=n;j++)d[0][j]=j;

    if(!s)s=base[0].n;if(s<base[0].n)s=base[0].n;if(s>base[base.length-1].n)s=base[base.length-1].n;stEl.value=s;

  else{const k=+v.slice(1);pick=shuffle(base).slice(0,k);mode='随机 '+k+' 词';}
